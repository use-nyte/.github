name: ESLint

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  lint:
    name: Check ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect PNPM Version Pin
        id: pnpm-pin
        shell: bash
        run: |
          if [ -f package.json ] && jq -e \
            '(.packageManager // .devEngines.packageManager) != null' \
            package.json > /dev/null; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PNPM from package.json
        if: steps.pnpm-pin.outputs.pinned == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup PNPM (Legacy Default)
        if: steps.pnpm-pin.outputs.pinned != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Detect Node.js Version Pin
        id: node-pin
        shell: bash
        run: |
          if [ -s .nvmrc ]; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js from .nvmrc
        if: steps.node-pin.outputs.pinned == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com/
          scope: "@use-nyte"
          package-manager-cache: false

      - name: Setup Node.js (Legacy Default)
        if: steps.node-pin.outputs.pinned != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          registry-url: https://npm.pkg.github.com/
          scope: "@use-nyte"
          package-manager-cache: false

      - name: Check ESLint
        run: pnpm dlx @use-nyte/eslint-config@2.0.0
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
