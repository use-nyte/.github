name: Prettier

on:
  workflow_call:

permissions:
  contents: write
  packages: read

jobs:
  format:
    name: Create Pull Request with Prettier Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ github.head_ref }}
      - name: Detect PNPM Version Pin
        id: pnpm-pin
        shell: bash
        run: |
          if [ -f package.json ] && jq -e \
            '(.packageManager // .devEngines.packageManager) != null' \
            package.json > /dev/null; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup PNPM from package.json
        if: steps.pnpm-pin.outputs.pinned == 'true'
        uses: pnpm/action-setup@v6
      - name: Setup PNPM (Legacy Default)
        if: steps.pnpm-pin.outputs.pinned != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: https://npm.pkg.github.com/
          scope: "@use-nyte"
          cache: pnpm
      - name: Format Code
        run: pnpm dlx @use-nyte/prettier-config@latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          push_options: "--force-with-lease --force-if-includes"
          commit_message: |
            chore: format code


            skip-checks: true
          commit_user_name: "use-nyte-bot"
          commit_user_email: ${{ secrets.BOT_EMAIL }}
          commit_author: "use-nyte-bot <${{ secrets.BOT_EMAIL }}>"
