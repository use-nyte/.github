name: Test Nyte Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-authentication:
    name: Verify GitHub App Authentication
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NYTE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.NYTE_AUTOMATION_PRIVATE_KEY }}
          owner: use-nyte
          repositories: |
            .github
            docs
            nyte
            nyte-server
            nyte-web
            eslint-config
            prettier-config
          permission-contents: read

      - name: Verify Repository Access
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail

          echo "Authenticated as Nyte Automation"

          repositories="$(gh api /installation/repositories \
            --paginate \
            --jq '.repositories[].full_name')"

          for repo in \
            .github \
            docs \
            nyte \
            nyte-server \
            nyte-web \
            eslint-config \
            prettier-config
          do
            expected="use-nyte/$repo"

            if printf '%s\n' "$repositories" | grep -Fxq "$expected"; then
              echo "Verified: $expected"
            else
              echo "::error::Missing access to $expected"
              exit 1
            fi
          done

          echo "All required repositories are accessible."
