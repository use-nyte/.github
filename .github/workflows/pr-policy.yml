name: PR Policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check Conventional Commit Title
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)

          pull_request = event.get("pull_request")
          if not pull_request:
              print("::error::This workflow requires a pull request event.")
              sys.exit(1)

          title = pull_request.get("title", "")
          pattern = re.compile(
              r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
              r"(\([a-z0-9][a-z0-9._/-]*\))?!?: [^\s].*$"
          )

          if (
              len(title) > 120
              or title != title.strip()
              or not pattern.fullmatch(title)
          ):
              print("::error::Invalid Conventional Commit PR title.")
              print("Expected: type(scope)!: description")
              print("Example: feat(auth): add authentication")
              sys.exit(1)

          print("PR title is valid:", title)
          PY
