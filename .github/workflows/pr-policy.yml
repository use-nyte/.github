name: PR Policy

on:
  workflow_call:
    inputs:
      enforce-linked-issues:
        description: Require verified issue references in PRs
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: read

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check Conventional Commit Title
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)

          pull_request = event.get("pull_request")
          if not pull_request:
              print("::error::This workflow requires a pull request event.")
              sys.exit(1)

          title = pull_request.get("title", "")
          pattern = re.compile(
              r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
              r"(\([a-z0-9][a-z0-9._/-]*\))?!?: [^\s].*$"
          )

          if (
              len(title) > 120
              or title != title.strip()
              or not pattern.fullmatch(title)
          ):
              print("::error::Invalid Conventional Commit PR title.")
              print("Expected: type(scope)!: description")
              print("Example: feat(auth): add authentication")
              sys.exit(1)

          print("PR title is valid:", title)
          PY

      - name: Validate Linked Issues
        if: ${{ inputs.enforce-linked-issues }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)

          pr = event.get("pull_request")
          if not pr:
              fail("This workflow requires a pull request event.")

          base_repo = pr["base"]["repo"]["full_name"]
          base_owner, base_name = base_repo.split("/", 1)

          # Only bypass issue validation for verified Release Please PRs.
          trusted_release = (
              pr.get("user", {}).get("id") == 281729270
              and pr["head"]["repo"]["full_name"] == base_repo
              and pr["head"]["ref"].startswith(
                  "release-please--branches--main--components--"
              )
              and pr["title"].startswith("chore(main): release ")
          )

          if trusted_release:
              print("Trusted Release Please PR; skipping issue validation.")
              sys.exit(0)

          # Remove template comments before searching for references.
          body = re.sub(
              r"<!--.*?-->",
              "",
              pr.get("body") or "",
              flags=re.DOTALL,
          )

          heading = re.search(
              r"(?im)^##\s+Related Issues\s*$",
              body,
          )
          if not heading:
              fail("PR description must contain a Related Issues section.")

          section = re.split(
              r"(?m)^##\s+",
              body[heading.end():],
              maxsplit=1,
          )[0]

          # Ignore fenced code examples.
          section = re.sub(
              r"(?ms)^```.*?^```\s*$",
              "",
              section,
          )

          pattern = re.compile(
              r"\b(?:refs?|fix(?:es)?|closes?|resolves?)\s*:?\s+"
              r"(?:(?P<owner>[A-Za-z0-9-]+)/"
              r"(?P<repo>[A-Za-z0-9_.-]+))?"
              r"#(?P<number>[1-9]\d*)\b",
              re.IGNORECASE,
          )
          references = list(pattern.finditer(section))

          if not references:
              fail(
                  "Add an issue reference to Related Issues, "
                  "for example: Refs #123."
              )

          token = os.environ["GH_TOKEN"]

          for reference in references:
              owner = reference.group("owner") or base_owner
              repo = reference.group("repo") or base_name
              number = int(reference.group("number"))

              if owner.lower() != base_owner.lower():
                  fail(f"External issue owner is not allowed: {owner}")

              full_ref = f"{owner}/{repo}#{number}"
              url = (
                  f"https://api.github.com/repos/"
                  f"{owner}/{repo}/issues/{number}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=15
                  ) as response:
                      issue = json.load(response)
              except urllib.error.HTTPError as error:
                  fail(
                      f"Could not verify {full_ref} "
                      f"(HTTP {error.code}). Check issue existence "
                      "and token access."
                  )
              except urllib.error.URLError as error:
                  fail(f"GitHub API request failed for {full_ref}: {error.reason}")

              if "pull_request" in issue:
                  fail(f"{full_ref} is a pull request, not an issue.")

              print(f"Verified issue: {full_ref}")

          print("All linked issue references are valid.")
          PY
