name: Release Node.js Package

on:
  workflow_call:
    secrets:
      NYTE_AUTOMATION_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Release Node.js Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Nyte Automation token
        id: app
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.NYTE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.NYTE_AUTOMATION_PRIVATE_KEY }}
          owner: use-nyte
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          release-type: node

      - name: Checkout repository
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: steps.release.outputs.release_created == 'true'
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: "@use-nyte"

      - name: Install dependencies
        if: steps.release.outputs.release_created == 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Publish package
        if: steps.release.outputs.release_created == 'true'
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
