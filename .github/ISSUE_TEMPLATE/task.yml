name: Task
description: Track development or maintenance work.
title: "[Task]: "

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Describe the expected outcome in plain text or bullets.
      placeholder: The expected outcome is…
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or Related Issues
      description: Link relevant issues or pull requests.
